<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbital Relay Terminal - Secret Code Decoder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: transparent; /* Transparent for Google Sites embedding */
            font-family: 'Courier New', Courier, monospace;
            color: #e2e8f0;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 980px;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
            z-index: 2;
        }

        /* Sci-Fi CRT Monitor Frame */
        .terminal-card {
            background: #0f172a;
            border: 2px solid #0ea5e9;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(14, 165, 233, 0.3), inset 0 0 20px rgba(14, 165, 233, 0.15);
            padding: 25px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        /* Glitch Animation Classes */
        .terminal-card.glitch-shake {
            animation: terminalShake 0.25s cubic-bezier(.36,.07,.19,.97) both;
            border-color: #ef4444 !important;
            box-shadow: 0 0 35px rgba(239, 68, 68, 0.6) !important;
        }
        @keyframes terminalShake {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-3px, 2px); }
            40% { transform: translate(3px, -2px); }
            60% { transform: translate(-2px, -1px); }
            80% { transform: translate(2px, 1px); }
        }
