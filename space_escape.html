<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep Space Terminal - Secret Code Decoder</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: transparent; /* Transparent for Google Sites embedding */
            font-family: 'Courier New', Courier, monospace;
            color: #38bdf8;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 950px;
            padding: 15px;
            box-sizing: border-box;
        }

        /* Sci-Fi CRT Monitor Frame */
        .terminal-card {
            background: #030712;
            border: 2px solid #0284c7;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(2, 132, 199, 0.35), inset 0 0 15px rgba(2, 132, 199, 0.15);
            padding: 25px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        /* CRT Scanline Overlay Effect */
        .terminal-card::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Header / Alarm Status Bar */
        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }
        .system-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .alarm-badge {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #f87171;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            animation: alarmPulse 1.2s infinite alternate;
        }
        @keyframes alarmPulse {
            0% { opacity: 0.4; box-shadow: 0 0 2px #ef4444; }
            100% { opacity: 1; box-shadow: 0 0 10px #ef4444; }
        }

        /* Radar & Mission Briefing */
        .briefing-row {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid #1e293b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .radar-screen {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid #0284c7;
            position: relative;
            background: radial-gradient(circle, rgba(2,132,199,0.2) 0%, rgba(3,7,18,0.9) 70%);
            flex-shrink: 0;
        }
        .radar-sweep {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0deg, transparent 300deg, rgba(56, 189, 248, 0.6) 360deg);
            animation: radarRotate 2.5s linear infinite;
        }
        @keyframes radarRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .briefing-text {
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.4;
        }

        /* Single Horizontal Row Container for 13 Boxes */
        .row-wrapper {
            width: 100%;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .single-row-grid {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 8px;
            min-width: 820px; /* Ensures straight horizontal line on small screens */
        }

        /* Individual Box Styling */
        .box-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 8px 4px;
            flex: 1;
            transition: all 0.2s ease;
        }
        .box-unit:hover {
            border-color: #0284c7;
            box-shadow: 0 0 8px rgba(2, 132, 199, 0.4);
        }
        .box-tag {
            font-size: 0.65rem;
            color: #64748b;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .terminal-input {
            width: 90%;
            background: #020617;
            border: 1px solid #1e293b;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.75rem;
            font-weight: 700;
            text-align: center;
            padding: 6px 2px;
            border-radius: 4px;
            outline: none;
            box-sizing: border-box;
        }
        .terminal-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 6px #0284c7;
        }
        .char-screen {
            margin-top: 6px;
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #020617;
            border: 1px solid #1e293b;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 800;
            color: #475569;
        }
        .char-screen.active {
            color: #22c55e;
            border-color: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
            background: rgba(34, 197, 94, 0.1);
        }

        /* Success Override Alert */
        .success-terminal {
            background: rgba(34, 197, 94, 0.1);
            border: 2px solid #22c55e;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
            animation: glowSuccess 1.5s infinite alternate;
        }
        @keyframes glowSuccess {
            from { box-shadow: 0 0 5px rgba(34, 197, 94, 0.2); }
            to { box-shadow: 0 0 20px rgba(34, 197, 94, 0.6); }
        }
        .success-title {
            color: #4ade80;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.1em;
        }
        .final-code-text {
            color: #22c55e;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 0.25em;
            margin-top: 5px;
            text-shadow: 0 0 8px #22c55e;
        }

        /* Control Buttons */
        .controls-bar {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        .action-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            font-weight: 800;
            border-radius: 6px;
            cursor: pointer;
            letter-spacing: 0.05em;
            box-shadow: 0 0 10px rgba(2, 132, 199, 0.4);
            transition: all 0.2s;
            flex: 1;
        }
        .action-btn:hover {
            background: #0369a1;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.7);
        }
        .action-btn.secondary {
            background: #334155;
            box-shadow: none;
            color: #cbd5e1;
        }
        .action-btn.secondary:hover {
            background: #475569;
        }

        .status-readout {
            font-size: 0.85rem;
            font-weight: 700;
            color: #38bdf8;
            text-align: center;
            margin-top: 10px;
            letter-spacing: 0.05em;
        }

        .hidden {
            display: none !important;
        }

        /* Footer Disclaimer Dropdown */
        .disclaimer-container {
            border-top: 1px solid #1e293b;
            padding-top: 12px;
            margin-top: 10px;
            text-align: center;
            position: relative;
            z-index: 3;
        }
        .disclaimer-toggle {
            background: none;
            border: none;
            color: #64748b;
            font-size: 0.7rem;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            transition: color 0.2s;
        }
        .disclaimer-toggle:hover {
            color: #38bdf8;
        }
        .disclaimer-content {
            font-size: 0.7rem;
            color: #94a3b8;
            background: #020617;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #1e293b;
            margin-top: 8px;
            text-align: left;
            line-height: 1.4;
        }
        .disclaimer-content a {
            color: #38bdf8;
            text-decoration: none;
        }
        .disclaimer-content a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<div class="main-container
